<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Editar Proveedor')}"></head>
<body>
    <div class="app-shell">
            <!-- Sidebar -->
            <nav th:replace="~{fragments/layout :: sidebar('proveedores')}"></nav>
            <!-- Main Content -->
            <main class="ios-main">
                <div class="form-container">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="page-title mb-0">
                            <i class="bi bi-truck"></i> Editar Proveedor
                        </h2>
                        <a th:href="@{/proveedores/listar}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                    <div class="ios-card">
                        <div class="card-body">
                            <form th:action="@{'/proveedores/editar/' + ${proveedor.idProveedor}}" th:object="${proveedor}" method="post" autocomplete="off">
                                <div class="mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" th:field="*{nombre}" class="form-control" required maxlength="100">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">RUC</label>
                                    <input type="text" th:field="*{ruc}" class="form-control" maxlength="11" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Teléfono</label>
                                    <input type="text" th:field="*{telefono}" class="form-control" maxlength="15" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" th:field="*{email}" class="form-control" maxlength="100" required>
                                </div>
                                <div class="d-flex justify-content-end mt-4">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-save"></i> Guardar Cambios
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
