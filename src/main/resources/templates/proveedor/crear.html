<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Nuevo Proveedor')}"></head>
<body>
    <div class="app-shell">
            <!-- Sidebar -->
            <nav th:replace="~{fragments/layout :: sidebar('proveedores')}"></nav>

            <!-- Main Content -->
            <main class="ios-main">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0"><i class="bi bi-truck"></i> Registrar Nuevo Proveedor</h2>
                    <a th:href="@{/proveedores/listar}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver a la lista
                    </a>
                </div>
                
                <div class="form-container">

                    
                    <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre del proveedor" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">RUC</label>
                                <input type="text" th:field="*{ruc}" class="form-control" placeholder="11 dígitos" maxlength="11" required>
                                <small class="text-muted">Ingrese el RUC sin guiones ni espacios</small>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" th:field="*{telefono}" class="form-control" placeholder="Número de contacto" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="correo@proveedor.com" required>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-3 mt-4">

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Guardar Proveedor
                            </button>
                        </div>
                    </form>
                </div>
            </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
