<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Lista de Proveedores')}"></head>
<body>
    <div class="app-shell">
            <!-- Sidebar -->
            <nav th:replace="~{fragments/layout :: sidebar('proveedores')}"></nav>

            <!-- Main Content -->
            <main class="ios-main">
                <!-- Header unificado con título y botones -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0">
                        <i class="bi bi-truck"></i> Lista de Proveedores
                    </h2>
                    <div class="d-flex gap-2">
                        <a th:href="@{/menu}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Menú
                        </a>
                        <a th:href="@{/proveedores/nuevo}" 
                           class="btn btn-success"
                           sec:authorize="hasAuthority('PROVEEDOR_CREATE')">
                            <i class="bi bi-truck"></i> Nuevo Proveedor
                        </a>
                    </div>
                </div>
                
                <!-- Mensaje informativo para usuarios de solo lectura -->
                <div class="alert alert-info d-flex align-items-center mb-3" 
                     sec:authorize="hasAuthority('PROVEEDOR_READ') and !hasAuthority('PROVEEDOR_CREATE')">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <span>Está visualizando los proveedores en <strong>modo consulta</strong>. Contacte a su administrador si necesita realizar modificaciones.</span>
                </div>

                <!-- Contenedor de tabla unificado -->
                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table ios-table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>RUC</th>
                                    <th>Teléfono</th>
                                    <th>Email</th>
                                    <th>Acciones</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="proveedor : ${proveedores}">
                                    <td th:text="${proveedor.idProveedor}"></td>
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <i class="bi bi-building text-muted me-2"></i>
                                            <strong th:text="${proveedor.nombre}"></strong>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="ruc-info" th:text="${proveedor.ruc}"></span>
                                    </td>
                                    <td>
                                        <div class="contact-info">
                                            <i class="bi bi-telephone text-muted me-1"></i>
                                            <span th:text="${proveedor.telefono}"></span>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="contact-info">
                                            <i class="bi bi-envelope text-muted me-1"></i>
                                            <a th:href="'mailto:' + ${proveedor.email}" 
                                            th:text="${proveedor.email}" 
                                            class="text-decoration-none"
                                            th:if="${proveedor.email != null and !proveedor.email.isEmpty()}"></a>
                                            <span th:unless="${proveedor.email != null and !proveedor.email.isEmpty()}" 
                                                class="text-muted">No disponible</span>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="d-flex gap-1">
                                            <!-- Solo para proveedores activos -->
                                            <a th:if="${proveedor.estado.name() == 'Activo'}"
                                            th:href="@{'/proveedores/editar/' + ${proveedor.idProveedor}}" 
                                            class="btn btn-outline-secondary btn-sm"
                                            sec:authorize="hasAuthority('PROVEEDOR_UPDATE')"
                                            title="Editar proveedor">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:if="${proveedor.estado.name() == 'Activo'}"
                                            th:href="@{'/proveedores/eliminar/' + ${proveedor.idProveedor}}" 
                                            class="btn btn-outline-warning btn-sm"
                                            sec:authorize="hasAuthority('PROVEEDOR_DELETE')"
                                            title="Inhabilitar proveedor">
                                                <i class="bi bi-exclamation-triangle"></i>
                                            </a>
                                            <!-- Solo para proveedores inactivos -->
                                            <form th:if="${proveedor.estado.name() == 'Inactivo'}"
                                                th:action="@{'/proveedores/activar/' + ${proveedor.idProveedor}}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-success btn-sm" title="Reactivar proveedor">
                                                    <i class="bi bi-arrow-repeat"></i>
                                                </button>
                                            </form>
                                        </div>
                                        <!-- Mensaje para usuarios de solo lectura -->
                                        <div class="d-flex align-items-center text-muted mt-1" 
                                            sec:authorize="hasAuthority('PROVEEDOR_READ') and !hasAuthority('PROVEEDOR_UPDATE')">
                                            <i class="bi bi-eye-fill me-1"></i>
                                            <small>Solo consulta</small>
                                        </div>
                                    </td>
                                    <td>
                                        <span th:classappend="${proveedor.estado.name() == 'Activo'} ? 'badge bg-success' : 'badge bg-secondary'"
                                            th:text="${proveedor.estado.name()}"></span>
                                    </td>
                                </tr>
                                
                                <!-- Estado vacío mejorado -->
                                <tr th:if="${proveedores == null or proveedores.isEmpty()}">
                                    <td colspan="6" class="text-center py-4">
                                        <div class="text-muted">
                                            <i class="bi bi-building display-1 opacity-25"></i>
                                            <h5 class="mt-3">No se encontraron proveedores</h5>
                                            <p>
                                                <a th:href="@{/proveedores/nuevo}" 
                                                   class="btn btn-success"
                                                   sec:authorize="hasAuthority('PROVEEDOR_CREATE')">
                                                    <i class="bi bi-building-add"></i> Agregar primer proveedor
                                                </a>
                                            </p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
