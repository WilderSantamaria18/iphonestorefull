<!DOCTYPE html>
<!--
  Fragmento Thymeleaf reutilizable: sidebar iOS + head común.
  Uso en cada template:
    <head th:replace="~{fragments/layout :: head('Título')}"></head>
    <nav th:replace="~{fragments/layout :: sidebar('productos')}"></nav>
-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- ============ HEAD COMÚN ============ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - IphoneStore'">IphoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<!-- ============ SIDEBAR iOS ============ -->
<nav th:fragment="sidebar(active)" class="ios-sidebar">
    <a class="navbar-brand" th:href="@{/menu}">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg"
             alt="Apple Logo" class="brand-logo">
        <span>IphoneStore</span>
    </a>
    <a th:href="@{/menu}" th:classappend="${active == 'menu'} ? 'active'" class="nav-link">
        <i class="bi bi-house-door-fill"></i> Menú Principal
    </a>
    <a th:href="@{/productos/listar}" th:classappend="${active == 'productos'} ? 'active'"
       class="nav-link" sec:authorize="hasAuthority('PRODUCTO_READ')">
        <i class="bi bi-phone-fill"></i> Productos
    </a>
    <a th:href="@{/Cliente/listar}" th:classappend="${active == 'clientes'} ? 'active'"
       class="nav-link" sec:authorize="hasAuthority('CLIENTE_READ')">
        <i class="bi bi-people-fill"></i> Clientes
    </a>
    <a th:href="@{/proveedores/listar}" th:classappend="${active == 'proveedores'} ? 'active'"
       class="nav-link" sec:authorize="hasAuthority('PROVEEDOR_READ')">
        <i class="bi bi-truck"></i> Proveedores
    </a>
    <a th:href="@{/pedidos/listar}" th:classappend="${active == 'pedidos'} ? 'active'"
       class="nav-link" sec:authorize="hasAuthority('PEDIDO_READ')">
        <i class="bi bi-bag-check-fill"></i> Pedidos
    </a>
    <a th:href="@{/comprobantes/listar}" th:classappend="${active == 'comprobantes'} ? 'active'"
       class="nav-link" sec:authorize="hasAuthority('COMPROBANTE_READ')">
        <i class="bi bi-receipt-cutoff"></i> Comprobantes
    </a>
    <a th:href="@{/usuarios/listar}" th:classappend="${active == 'usuarios'} ? 'active'"
       class="nav-link" sec:authorize="hasAuthority('USUARIO_READ')">
        <i class="bi bi-person-gear"></i> Usuarios
    </a>
    <a th:href="@{/login}" class="nav-link text-danger">
        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
    </a>
    <div class="sidebar-footer">
        © 2025 IphoneStore. Todos los derechos reservados.
    </div>
</nav>

</body>
</html>
