<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Lista de Productos')}"></head>
<body>
    <div class="app-shell">
        <nav th:replace="~{fragments/layout :: sidebar('productos')}"></nav>
        <main class="ios-main">
            <div class="page-header">
                <h2><i class="bi bi-phone-fill"></i> Lista de Productos</h2>
                <div class="header-actions">
                    <a th:href="@{/menu}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Menú
                    </a>
                    <a th:href="@{/productos/nuevo}" class="btn btn-primary"
                       sec:authorize="hasAuthority('PRODUCTO_CREATE')">
                        <i class="bi bi-plus-circle"></i> Nuevo Producto
                    </a>
                </div>
            </div>

            <div class="alert alert-info d-flex align-items-center mb-3 ios-fade-in"
                 sec:authorize="hasAuthority('PRODUCTO_READ') and !hasAuthority('PRODUCTO_CREATE')">
                <i class="bi bi-info-circle-fill me-2"></i>
                <span>Está visualizando los productos en <strong>modo consulta</strong>. Contacte a su administrador si necesita realizar modificaciones.</span>
            </div>

            <div class="table-container ios-fade-up">
                <div class="table-responsive">
                    <table class="table ios-table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Modelo</th>
                                <th>Proveedor</th>
                                <th>Especificaciones</th>
                                <th>Precios</th>
                                <th>Stock</th>
                                <th>Imagen</th>
                                <th>Acciones</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="producto : ${productos}">
                                <td th:text="${producto.idProducto}"></td>
                                <td>
                                    <div>
                                        <strong th:text="${producto.modelo}"></strong>
                                    </div>
                                    <div class="text-muted small" th:text="${producto.lanzamiento}"></div>
                                </td>
                                <td>
                                    <i class="bi bi-building text-muted me-1"></i>
                                    <span th:text="${producto.proveedor != null ? producto.proveedor.nombre : 'N/A'}"></span>
                                </td>
                                <td>
                                    <div class="small">
                                        <div><i class="bi bi-cpu text-muted me-1"></i><span th:text="${'CPU: ' + producto.procesador}"></span></div>
                                        <div><i class="bi bi-memory text-muted me-1"></i><span th:text="${'RAM: ' + producto.ram}"></span></div>
                                        <div><i class="bi bi-hdd text-muted me-1"></i><span th:text="${'Alm: ' + producto.almacenamiento}"></span></div>
                                    </div>
                                </td>
                                <td>
                                    <div class="precio-info">
                                        <div class="precio-venta">
                                            <i class="bi bi-tag-fill me-1"></i>S/ <span th:text="${#numbers.formatDecimal(producto.precioVenta, 1, 2)}"></span>
                                        </div>
                                        <div class="precio-costo">
                                            <i class="bi bi-receipt me-1"></i>S/ <span th:text="${#numbers.formatDecimal(producto.precioCosto, 1, 2)}"></span>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span th:class="${producto.stock > 10 ? 'badge badge-stock badge-stock-success' :
                                                     (producto.stock > 0 ? 'badge badge-stock badge-stock-warning' :
                                                     'badge badge-stock badge-stock-danger')}"
                                          th:text="${producto.stock} + ' unidades'">
                                    </span>
                                </td>
                                <td>
                                    <img th:src="${producto.imagen}" class="product-img"
                                         th:alt="${'Imagen de ' + producto.modelo}"
                                         th:if="${producto.imagen != null and !producto.imagen.isEmpty()}"
                                         title="Imagen del producto">
                                    <div th:unless="${producto.imagen != null and !producto.imagen.isEmpty()}"
                                         class="d-flex align-items-center justify-content-center"
                                         style="width: 60px; height: 60px; background-color: var(--ink-800); border-radius: 12px;">
                                        <i class="bi bi-image text-muted"></i>
                                    </div>
                                </td>
                                <td>
                                    <div class="d-flex gap-1">
                                        <a th:if="${producto.estado.name() == 'Activo'}"
                                           th:href="@{'/productos/editar/' + ${producto.idProducto}}"
                                           class="btn btn-outline-secondary btn-sm"
                                           sec:authorize="hasAuthority('PRODUCTO_UPDATE')"
                                           title="Editar producto">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:if="${producto.estado.name() == 'Activo'}"
                                           th:href="@{'/productos/eliminar/' + ${producto.idProducto}}"
                                           class="btn btn-outline-warning btn-sm"
                                           sec:authorize="hasAuthority('PRODUCTO_DELETE')"
                                           title="Inhabilitar producto">
                                            <i class="bi bi-exclamation-triangle"></i>
                                        </a>
                                        <form th:if="${producto.estado.name() == 'Inactivo'}"
                                              th:action="@{'/productos/activar/' + ${producto.idProducto}}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-success btn-sm" title="Reactivar producto">
                                                <i class="bi bi-arrow-repeat"></i>
                                            </button>
                                        </form>
                                    </div>
                                    <div class="d-flex align-items-center text-muted mt-1"
                                         sec:authorize="hasAuthority('PRODUCTO_READ') and !hasAuthority('PRODUCTO_UPDATE')">
                                        <i class="bi bi-eye-fill me-1"></i>
                                        <small>Solo consulta</small>
                                    </div>
                                </td>
                                <td>
                                    <span th:classappend="${producto.estado.name() == 'Activo'} ? 'badge bg-success' : 'badge bg-secondary'"
                                          th:text="${producto.estado.name()}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
