<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Editar Producto')}"></head>
<body>
    <div class="app-shell">
            <!-- Sidebar -->
            <nav th:replace="~{fragments/layout :: sidebar('productos')}"></nav>

            <!-- Main Content -->
            <main class="ios-main">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="page-title mb-0"><i class="bi bi-pencil-square"></i> Editar Producto</h2>
                    <a th:href="@{/productos/listar}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver a la lista
                    </a>
                </div>
                
                <div class="form-container">
                    <form th:action="@{'/productos/editar/' + ${producto.idProducto}}" th:object="${producto}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Proveedor</label>
                                <select th:field="*{proveedor.idProveedor}" class="form-select" required>
                                    <option th:each="prov : ${proveedores}" 
                                            th:value="${prov.idProveedor}" 
                                            th:text="${prov.nombre}"
                                            th:selected="${prov.idProveedor == producto.proveedor.idProveedor}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Modelo</label>
                                <input type="text" th:field="*{modelo}" class="form-control" placeholder="Ej: iPhone 15 Pro Max" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Año de Lanzamiento</label>
                                <input type="text" th:field="*{lanzamiento}" class="form-control" placeholder="Ej: 2024" maxlength="4" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Procesador</label>
                                <input type="text" th:field="*{procesador}" class="form-control" placeholder="Ej: A16 Bionic" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">RAM (GB)</label>
                                <input type="text" th:field="*{ram}" class="form-control" placeholder="Ej: 8 GB" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Almacenamiento</label>
                                <input type="text" th:field="*{almacenamiento}" class="form-control" placeholder="Ej: 256 GB" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Precio Venta</label>
                                <div class="input-group">
                                    <span class="input-group-text">S/</span>
                                    <input type="number" step="0.01" th:field="*{precioVenta}" class="form-control" placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Precio Costo</label>
                                <div class="input-group">
                                    <span class="input-group-text">S/</span>
                                    <input type="number" step="0.01" th:field="*{precioCosto}" class="form-control" placeholder="0.00" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" th:field="*{stock}" class="form-control" placeholder="Cantidad en stock" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Imagen (URL)</label>
                                <input type="text" th:field="*{imagen}" class="form-control" placeholder="https://ejemplo.com/imagen.jpg"
                                       onchange="document.getElementById('image-preview').src = this.value">
                                <img th:src="${producto.imagen}" id="image-preview" class="preview-image" 
                                     th:alt="${'Imagen de ' + producto.modelo}" 
                                     onerror="this.style.display='none'">
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-3 mt-4">

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
