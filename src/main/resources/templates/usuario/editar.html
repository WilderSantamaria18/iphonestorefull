<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Editar Usuario')}"></head>
<body>
    <div class="app-shell">
            <nav th:replace="~{fragments/layout :: sidebar('usuarios')}"></nav>

            <main class="ios-main">
                <div class="edit-container mx-auto">
                    <h2 class="page-title">
                        <i class="bi bi-person-gear"></i>
                        Editar Usuario
                    </h2>

                    <div class="ios-card">
                        <div class="card-body">
                            <form th:action="@{'/usuarios/editar/' + ${usuario.idUsuario}}" th:object="${usuario}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Nombres</label>
                                        <input type="text" class="form-control" th:field="*{nombres}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">DNI</label>
                                        <input type="text" class="form-control" th:field="*{dni}" maxlength="8" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" th:field="*{email}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Nombre de Usuario</label>
                                        <input type="text" class="form-control" th:field="*{username}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Contraseña</label>
                                        <input type="password" class="form-control" th:field="*{contrasena}" placeholder="Dejar en blanco para no cambiar">
                                        <div class="form-text">Deje en blanco si no desea cambiar la contraseña</div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Cargo</label>
                                        <select class="form-select" name="cargo.idCargo" required>
                                            <option value="">Seleccione un cargo</option>
                                            <option th:each="cargo : ${cargos}" 
                                                    th:value="${cargo.idCargo}" 
                                                    th:text="${cargo.nombre}"
                                                    th:selected="${cargo.idCargo == usuario.cargo.idCargo}"></option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center actions-footer">
                                    <a th:href="@{/usuarios/listar}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left"></i> Volver a la lista
                                    </a>
                                    <button type="submit" class="btn btn-success">
                                        <i class="bi bi-save"></i> Guardar Cambios
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
