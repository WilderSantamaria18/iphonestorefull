<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Editar Cliente')}"></head>
<body>
    <div class="app-shell">
            <!-- Sidebar -->
            <nav th:replace="~{fragments/layout :: sidebar('clientes')}"></nav>
            <!-- Main Content -->
            <main class="ios-main">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="page-title mb-0">
                            <i class="bi bi-person-gear"></i> Editar Cliente
                        </h2>
                        <a th:href="@{/Cliente/listar}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                    <div class="ios-card">
                        <div class="card-body">
                            <form th:action="@{'/Cliente/editar/' + ${cliente.idCliente}}" th:object="${cliente}" method="post" autocomplete="off">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Tipo de Cliente</label>
                                        <select class="form-select" th:field="*{tipoCliente}" required>
                                            <option value="">Seleccione el tipo de cliente</option>
                                            <option value="Natural">Natural</option>
                                            <option value="Juridica">Jurídica</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Nombre</label>
                                        <input type="text" class="form-control" th:field="*{nombre}" required maxlength="100">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Documento</label>
                                        <input type="text" class="form-control" th:field="*{documento}" required maxlength="15">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Dirección</label>
                                        <input type="text" class="form-control" th:field="*{direccion}" required maxlength="150">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Teléfono</label>
                                        <input type="text" class="form-control" th:field="*{telefono}" required maxlength="15">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" th:field="*{email}" required maxlength="100">
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end mt-4">
                                    <button type="submit" class="btn btn-success">
                                        <i class="bi bi-save"></i> Guardar Cambios
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
            </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
