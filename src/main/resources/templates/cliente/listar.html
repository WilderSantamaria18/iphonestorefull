<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
    <div class="app-shell">
            <!-- Sidebar -->
            <nav th:replace="~{fragments/layout :: sidebar('clientes')}"></nav>

            <!-- Main Content -->
            <main class="ios-main">
                <!-- Header reorganizado con título a la izquierda y botones a la derecha -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="page-title mb-0">
                        <i class="bi bi-people-fill"></i> Lista de Clientes
                    </h2>
                    <div class="d-flex gap-2">
                        <a th:href="@{/menu}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Menú
                        </a>
                        <a th:href="@{/Cliente/nuevo}" 
                           class="btn btn-primary"
                           sec:authorize="hasAuthority('CLIENTE_CREATE')">
                            <i class="bi bi-person-plus-fill"></i> Nuevo Cliente
                        </a>
                    </div>
                </div>
                
                <!-- Mensaje informativo para usuarios de solo lectura -->
                <div class="alert alert-info d-flex align-items-center mb-3" 
                     sec:authorize="hasAuthority('CLIENTE_READ') and !hasAuthority('CLIENTE_CREATE')">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <span>Está visualizando los clientes en <strong>modo consulta</strong>. Contacte a su administrador si necesita realizar modificaciones.</span>
                </div>

                <!-- Contenedor de tabla unificado -->
                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table ios-table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tipo</th>
                                    <th>Nombre</th>
                                    <th>Documento</th>
                                    <th>Teléfono</th>
                                    <th>Acciones</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cliente : ${clientes}">
                                    <td th:text="${cliente.idCliente}"></td>
                                    <td>
                                        <span th:if="${cliente.tipoCliente == 'Natural'}" 
                                              class="badge badge-tipo badge-natural">
                                            <i class="bi bi-person"></i> Natural
                                        </span>
                                        <span th:if="${cliente.tipoCliente == 'Juridica'}" 
                                              class="badge badge-tipo badge-juridica">
                                            <i class="bi bi-building"></i> Jurídica
                                        </span>
                                    </td>
                                    <td th:text="${cliente.nombre}"></td>
                                    <td th:text="${cliente.documento}"></td>
                                    <td>
                                        <i class="bi bi-telephone text-muted me-1"></i>
                                        <span th:text="${cliente.telefono}"></span>
                                    </td>
                                    <td>
                                        <div class="d-flex gap-1">
                                            <!-- Solo para clientes activos -->
                                            <a th:if="${cliente.estado.name() == 'Activo'}"
                                            th:href="@{'/Cliente/editar/' + ${cliente.idCliente}}"
                                            class="btn btn-outline-secondary btn-sm"
                                            sec:authorize="hasAuthority('CLIENTE_UPDATE')"
                                            title="Editar cliente">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:if="${cliente.estado.name() == 'Activo'}"
                                            th:href="@{'/Cliente/eliminar/' + ${cliente.idCliente}}"
                                            class="btn btn-outline-warning btn-sm"
                                            sec:authorize="hasAuthority('CLIENTE_DELETE')"
                                            title="Inhabilitar cliente">
                                                <i class="bi bi-exclamation-triangle"></i>
                                            </a>
                                            <!-- Solo para clientes inactivos -->
                                            <form th:if="${cliente.estado.name() == 'Inactivo'}"
                                                th:action="@{'/Cliente/activar/' + ${cliente.idCliente}}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-success btn-sm" title="Reactivar cliente">
                                                    <i class="bi bi-arrow-repeat"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                    <!-- Estado -->
                                    <td>
                                        <span th:classappend="${cliente.estado.name == 'Activo'} ? 'badge bg-success' : 'badge bg-secondary'"
                                            th:text="${cliente.estado.name}"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
