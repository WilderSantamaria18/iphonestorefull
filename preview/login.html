<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - IphoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="IphoneStore Logo" class="brand-logo">
                <h2>IphoneStore</h2>
                <div class="login-subtitle">Acceso al sistema</div>
            </div>
            <div class="login-body">
                <form>
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" placeholder="Ingrese su usuario">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña">
                            <span class="toggle-password"><i class="bi bi-eye"></i></span>
                        </div>
                    </div>
                    <div class="d-grid mb-2">
                        <button type="button" class="btn-login">
                            <i class="bi bi-box-arrow-in-right"></i> Ingresar
                        </button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="#" class="text-decoration-none" style="font-size: 0.9rem;">¿Olvidó su contraseña?</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-3" style="font-size: 0.85rem; color: var(--ios-tertiary-label);">
            © 2025 IphoneStore. Todos los derechos reservados.
        </div>
    </div>
</body>
</html>
