<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menú - IphoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <nav class="ios-sidebar">
            <a class="navbar-brand" href="#">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Logo" class="brand-logo">
                <span>IphoneStore</span>
            </a>
            <a href="#" class="nav-link active"><i class="bi bi-house-door-fill"></i> Menú Principal</a>
            <a href="#" class="nav-link"><i class="bi bi-phone-fill"></i> Productos</a>
            <a href="#" class="nav-link"><i class="bi bi-people-fill"></i> Clientes</a>
            <a href="#" class="nav-link"><i class="bi bi-truck"></i> Proveedores</a>
            <a href="#" class="nav-link"><i class="bi bi-bag-check-fill"></i> Pedidos</a>
            <a href="#" class="nav-link"><i class="bi bi-receipt-cutoff"></i> Comprobantes</a>
            <a href="#" class="nav-link"><i class="bi bi-person-gear"></i> Usuarios</a>
            <a href="#" class="nav-link text-danger"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
            <div class="sidebar-footer">© 2025 IphoneStore. Todos los derechos reservados.</div>
        </nav>
        <main class="ios-main">
            <div class="page-header">
                <h2><i class="bi bi-house-door-fill"></i> Menú Principal</h2>
            </div>
            <div class="ios-card ios-fade-up">
                <div class="card-header"><i class="bi bi-house-door-fill"></i> Menú Principal</div>
                <div class="card-body">
                    <div class="alert alert-info text-center" role="alert">¡Bienvenido al sistema de IphoneStore!</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
