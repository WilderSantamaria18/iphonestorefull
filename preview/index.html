<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vista Previa iOS - IphoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { padding: 0; }
        .preview-tabs {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--ios-opaque-separator);
            padding: 0.6rem 1rem; display: flex; gap: 0.5rem; align-items: center;
        }
        .preview-tabs .btn { font-size: 0.85rem; padding: 0.4rem 0.9rem; }
        .preview-frame { margin-top: 56px; }
        .preview-frame iframe { width: 100%; height: calc(100vh - 56px); border: none; }
    </style>
</head>
<body>
    <div class="preview-tabs">
        <strong style="margin-right:0.5rem;">Vista previa iOS:</strong>
        <button class="btn btn-primary" onclick="show('login.html')">Login</button>
        <button class="btn btn-outline-secondary" onclick="show('menu.html')">Menú</button>
        <button class="btn btn-outline-secondary" onclick="show('productos.html')">Productos</button>
        <button class="btn btn-outline-secondary" onclick="show('formulario.html')">Formulario</button>
    </div>
    <div class="preview-frame">
        <iframe id="frame" src="login.html"></iframe>
    </div>
    <script>
        function show(page) {
            document.getElementById('frame').src = page;
        }
    </script>
</body>
</html>
